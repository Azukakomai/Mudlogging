<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600" style="background: transparent;">
<defs>
  <!-- Card Drop Shadow for White / Light Background -->
  <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>

  <style>
    .title{font:800 28px Inter,Segoe UI,sans-serif;fill:#0F172A;letter-spacing:.2px}
    .subtitle{font:500 14.5px Inter,Segoe UI,sans-serif;fill:#475569}
    .stage{font:800 20px Inter,Segoe UI,sans-serif;letter-spacing:.2px}
    .section{font:italic 13px Inter,Segoe UI,sans-serif;fill:#64748B}
    .cardtitle{font:700 15.5px Inter,Segoe UI,sans-serif}
    .body{font:450 13.5px Inter,Segoe UI,sans-serif;fill:#334155}
    .bold{font-weight:700;fill:#0F172A}
    .boldgreen{font-weight:700;fill:#047857}
    .boldblue{font-weight:700;fill:#0369A1}
    .boldamber{font-weight:700;fill:#B45309}
    .small{font:400 12px Inter,Segoe UI,sans-serif;fill:#64748B}
    .bannerhead{font:800 16px Inter,Segoe UI,sans-serif;fill:#92400E;letter-spacing:.3px}
    .bannertxt{font:450 13.5px Inter,Segoe UI,sans-serif;fill:#1E293B}
    .arrowtxt{font:700 12px Inter,Segoe UI,sans-serif;fill:#475569}
  </style>
</defs>

<!-- Main Title Header -->
<text x="75" y="52" class="title">CHAPTER 4: RESULTS, SYSTEM REALIZATION &amp; EMPIRICAL EVALUATION</text>
<text x="75" y="78" class="subtitle">Mapping Chapter 3 Research Design to Verified Empirical Outcomes, Live In-Situ Calibration &amp; Audit Metrics</text>

<!-- Governance Callout Banner -->
<rect x="75" y="102" width="1650" height="145" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
<text x="105" y="134" class="bannerhead">🛡 DATA GOVERNANCE &amp; IN-SITU EXPERT EVALUATION PROTOCOL (WHAT WAS DONE IN PRACTICE)</text>
<text x="105" y="164" class="bannertxt">• <tspan class="bold">Zero Proprietary Data Acquisition:</tspan> Fully compliant with petroleum NDAs; researcher held <tspan class="bold">no private well logs</tspan>.</text>
<text x="105" y="189" class="bannertxt">• <tspan class="bold">Zero-Installation Cloud Deployment:</tspan> Deployed on Vercel Edge; domain expert operated the software on <tspan class="bold">his authorized workstation</tspan>.</text>
<text x="105" y="214" class="bannertxt">• <tspan class="bold">Live Collaborative Calibration:</tspan> Interactive screen-share &amp; whiteboard sessions; threshold cutoffs were tuned <tspan class="bold">live on the expert's active system</tspan>.</text>

