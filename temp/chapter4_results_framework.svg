<text x="125" y="536" class="body">✓ NFR-01: Runtime <tspan class="boldgreen">1.52 s</tspan> (&lt; 5.0 s target)</text>
<text x="125" y="558" class="body">✓ NFR-02: <tspan class="boldblue">100% Traceable PRMS</tspan> deterministic audit</text>
