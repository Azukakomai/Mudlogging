<rect x="960" y="895" width="740" height="260" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
<text x="985" y="925" class="cardtitle" fill="#B45309">Ground-Truth Formation Test Results (N = 16 MDT/RFT Verified Intervals)</text>
<text x="985" y="953" class="body">• <tspan class="boldgreen">Oil Pay: 5/5 TP</tspan> (100% Precision | 100% Recall | F1 = 1.000)</text>
<text x="985" y="976" class="body">• <tspan class="boldblue">Gas Pay: 8/8 TP</tspan> (72.7% Precision | 100% Recall | F1 = 0.842)</text>
<text x="985" y="999" class="body">• <tspan class="bold">Non-Bearing: 3 FP</tspan> (Recycled mud gas blips in tight shale)</text>
<text x="985" y="1022" class="body">• <tspan class="boldamber">Overall Accuracy: 81.3%</tspan> (13 / 16 intervals correctly classified)</text>
<text x="985" y="1045" class="body">• <tspan class="boldgreen">Hydrocarbon Pay Sensitivity: 100.0%</tspan> (Zero missed commercial pay)</text>
<text x="985" y="1068" class="body">• <tspan class="boldgreen">Hydrocarbon Discrimination (Oil vs Gas): 100.0%</tspan></text>
<text x="985" y="1091" class="body">• <tspan class="bold">Pay Macro F1-Score: 0.921</tspan> (Exceeding 0.75 target benchmark)</text>

<rect x="960" y="1170" width="740" height="145" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
<text x="985" y="1200" class="cardtitle" fill="#B45309">Methodological Benchmarking</text>
